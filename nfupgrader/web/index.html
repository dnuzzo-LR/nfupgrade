<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>netFLEX Upgrade</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>netFLEX Upgrade &mdash; <span id="host">this host</span></h1>

  <section id="progress">
    <h2>Progress</h2>
    <div id="phase-line">Phase: <b id="phase">-</b> &middot; Status: <b id="status">-</b></div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="counter">0 / 0</div>
    <div id="current">-</div>
  </section>

  <section id="about">
    <h2>About this host</h2>
    <div id="about-grid" class="grid"></div>
    <h3>Multibox links</h3>
    <pre id="links">-</pre>
  </section>

  <section id="controls">
    <h2>Launch</h2>
    <button id="btn-stage">Start Staging</button>
    <button id="btn-upgrade">Start Upgrade</button>
    <span id="launch-msg"></span>
  </section>

  <section id="logs">
    <h2>Log</h2>
    <label>Show:
      <select id="min-sev">
        <option value="">All</option>
        <option value="INFO">INFO+</option>
        <option value="WARN">WARN+</option>
        <option value="ERROR">ERROR+</option>
        <option value="FATAL">FATAL only</option>
      </select>
    </label>
    <pre id="log"></pre>
  </section>

  <script src="/app.js"></script>
</body>
</html>
